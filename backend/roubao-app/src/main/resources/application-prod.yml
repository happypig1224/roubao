# ==============================================================================
# Roubao 生产环境专属配置 (Profile: prod)
# 强制要求注入生产级数据库凭证与 ADMIN_TOKEN
# ==============================================================================

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:roubao_blog}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY:true}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: RoubaoHikariCP-Prod
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    clean-disabled: true

storage:
  type: ${STORAGE_TYPE:s3}
  endpoint: ${STORAGE_ENDPOINT:}
  bucket: ${STORAGE_BUCKET:}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  cdn-domain: ${STORAGE_CDN_DOMAIN:}

roubao:
  admin:
    token: ${ADMIN_TOKEN}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,https://roubao.dev,https://www.roubao.dev}
