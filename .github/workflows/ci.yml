name: Roubao CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. 后端工程单元与契约测试门禁 (Java 21 + Spring Boot 3)
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Test & Build Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests (70/70 Tests)
        run: |
          cd backend
          mvn clean test -B

      - name: Build Backend Fat JAR
        run: |
          cd backend
          mvn package -DskipTests -B

      - name: Archive Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/

  # ----------------------------------------------------------------------------
  # 2. 前端代码质量与构建门禁 (Next.js 16 + TypeScript + ESLint)
  # ----------------------------------------------------------------------------
  frontend-test:
    name: Frontend Lint & Build Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run ESLint
        run: |
          cd frontend
          pnpm lint

      - name: Build Next.js Production App (Standalone Mode)
        run: |
          cd frontend
          pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
