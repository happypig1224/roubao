# ==============================================================================
# 肉包 (Roubao) 生产级 Nginx 接入网关配置 (Docker Compose 专享)
# 架构定位: Next.js 16 (frontend:3000) + Spring Boot 3 / Java 21 (backend:8080)
# ==============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 隐藏 Nginx 详细版本号，防止指纹特征识别攻击
    server_tokens off;

    # 结构化日志输出格式 (对齐全链路可观测性与 Trace 追踪)
    log_format json_combined escape=json '{'
        '"time_local":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_combined;

    # 零拷贝内核传输与连接优化
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    client_max_body_size 20m;
    client_body_buffer_size 128k;

    # 全站内容传输压缩 (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # WebSocket / SSE 长连接协议升级映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 频控限流
    limit_req_zone $binary_remote_addr zone=portal_api_zone:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=admin_api_zone:10m rate=5r/s;

    # --------------------------------------------------------------------------
    # 容器内部上游池
    # --------------------------------------------------------------------------
    upstream roubao_backend {
        server backend:8080 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    upstream roubao_frontend {
        server frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # --------------------------------------------------------------------------
    # 主 HTTP 虚拟主机定义 (默认监听 80 端口)
    # --------------------------------------------------------------------------
    server {
        listen       80;
        server_name  roubao.cloud www.roubao.cloud 47.251.182.2 localhost;

        # 基础安全防护响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # 1. 后台管理接口路由 (严格限流 + 文件上传放行)
        location /api/v1/admin/ {
            limit_req zone=admin_api_zone burst=10 nodelay;

            proxy_pass http://roubao_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            client_max_body_size 20m;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # 2. 博客与展厅门户公开 API 路由
        location /api/v1/ {
            limit_req zone=portal_api_zone burst=30 nodelay;

            proxy_pass http://roubao_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # 3. Next.js 静态构建产物长效强缓存 (/_next/static/)
        location /_next/static/ {
            proxy_pass http://roubao_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            access_log off;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 4. 静态多媒体资源缓存 (图片、矢量图标与字体)
        location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot)$ {
            proxy_pass http://roubao_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # 5. 前端主应用与 SSR 路由 (支持 WebSocket / 热重载)
        location / {
            proxy_pass http://roubao_frontend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # 错误页面友好兜底
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
