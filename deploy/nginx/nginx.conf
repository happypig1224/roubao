# ==============================================================================
# 肉包 (Roubao) 生产级 Nginx 接入网关配置
# 架构定位: Next.js 16 (SSR/Static :3000) + Spring Boot 3 / Java 21 (:8080)
# ==============================================================================

# 运行进程数 (Windows 平台建议设为 1，Linux 生产环境可配置为 auto)
worker_processes auto;

error_log logs/error.log warn;
pid       logs/nginx.pid;

# 客户端并发连接配置
events {
    # Linux 平台建议开启 epoll，Windows 平台自动降级使用原生驱动
    # use epoll;
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 隐藏 Nginx 详细版本号，防止指纹特征识别攻击
    server_tokens off;

    # --------------------------------------------------------------------------
    # 结构化日志输出格式 (对齐全链路可观测性与 Trace 追踪)
    # --------------------------------------------------------------------------
    log_format json_combined escape=json '{'
        '"time_local":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log logs/access.log json_combined;

    # --------------------------------------------------------------------------
    # 零拷贝内核传输与连接优化
    # --------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 客户端上传与缓冲区配置 (支持后台 Markdown 大文件上传)
    client_max_body_size 20m;
    client_body_buffer_size 128k;

    # --------------------------------------------------------------------------
    # 全站内容传输压缩 (Gzip)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # WebSocket / SSE 长连接协议升级映射
    # --------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --------------------------------------------------------------------------
    # 接入层频控限流 (精准防刷与 DDoS 基础防护)
    # --------------------------------------------------------------------------
    # 全局开放 API 限流区 (20次/秒，容忍 30 突发)
    limit_req_zone $binary_remote_addr zone=portal_api_zone:10m rate=20r/s;
    # 后台管理写操作限流区 (5次/秒，容忍 10 突发)
    limit_req_zone $binary_remote_addr zone=admin_api_zone:10m rate=5r/s;

    # --------------------------------------------------------------------------
    # 上游后端应用服务池 (Upstream Pool with Keepalive)
    # --------------------------------------------------------------------------
    # 1. Spring Boot 3 业务微服务集群
    upstream roubao_backend {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
        # 保持 128 个长连接，消除频繁三次握手与 TIME_WAIT 堆积
        keepalive 128;
    }

    # 2. Next.js 16 现代前端 SSR / 静态渲染服务
    upstream roubao_frontend {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # --------------------------------------------------------------------------
    # 主 HTTP 虚拟主机定义 (默认监听 80 端口)
    # --------------------------------------------------------------------------
    server {
        listen       80;
        server_name  localhost;

        # 基础安全防护响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ----------------------------------------------------------------------
        # 1. 后台管理接口路由 (严格限流 + 文件上传放行)
        # ----------------------------------------------------------------------
        location /api/v1/admin/ {
            limit_req zone=admin_api_zone burst=10 nodelay;

            proxy_pass http://roubao_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 身份凭证透传与防伪造
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # 针对大文件上传提高超时防挂断
            client_max_body_size 20m;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # 2. 博客与展厅门户公开 API 路由
        # ----------------------------------------------------------------------
        location /api/v1/ {
            limit_req zone=portal_api_zone burst=30 nodelay;

            proxy_pass http://roubao_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ----------------------------------------------------------------------
        # 3. Next.js 静态构建产物长效强缓存 (/_next/static/)
        # ----------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://roubao_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            access_log off;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ----------------------------------------------------------------------
        # 4. 静态多媒体资源缓存 (图片、矢量图标与字体)
        # ----------------------------------------------------------------------
        location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot)$ {
            proxy_pass http://roubao_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # ----------------------------------------------------------------------
        # 5. 前端主应用与 SSR 路由 (支持 WebSocket / 热重载)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://roubao_frontend;
            proxy_http_version 1.1;

            # WebSocket 与 HMR 支持
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # 错误页面友好兜底
        # ----------------------------------------------------------------------
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}

