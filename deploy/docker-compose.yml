# ==============================================================================
# 肉包 (Roubao) 生产级全栈单机容器编排配置 (Docker Compose)
# 编排服务: Nginx 1.24 + Next.js 16 + Spring Boot 3 / Java 21 + MySQL 8.0 + Redis 7
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. 关系型数据库 MySQL 8.0
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0.36
    container_name: roubao-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=300
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RoubaoProd2026SecureRoot!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-roubao_blog}
      MYSQL_USER: ${MYSQL_USER:-roubao_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-RoubaoProd2026UserSecurePass!}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - roubao-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RoubaoProd2026SecureRoot!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 2. 高速缓存 Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: roubao-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-RoubaoProd2026RedisPass!}"
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - roubao-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RoubaoProd2026RedisPass!}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. 后端服务 Spring Boot 3 (Java 21 虚拟线程)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: roubao-backend:latest
    container_name: roubao-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-roubao_blog}
      DB_USER: ${MYSQL_USER:-roubao_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-RoubaoProd2026UserSecurePass!}
      DB_USE_SSL: "false"
      DB_ALLOW_PUBLIC_KEY: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RoubaoProd2026RedisPass!}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-RoubaoProductionSecretToken2026Safe!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,https://roubao.dev,https://www.roubao.dev}
      TZ: Asia/Shanghai
    volumes:
      - app_logs:/app/logs
    networks:
      - roubao-net
    expose:
      - "8080"

  # ----------------------------------------------------------------------------
  # 4. 前端应用 Next.js 16 (Standalone SSR / 静态)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: roubao-frontend:latest
    container_name: roubao-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_API_URL: http://backend:8080
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    networks:
      - roubao-net
    expose:
      - "3000"

  # ----------------------------------------------------------------------------
  # 5. 接入网关 Nginx 1.24
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.24-alpine
    container_name: roubao-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.docker.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    networks:
      - roubao-net

networks:
  roubao-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  app_logs:
  nginx_logs:
